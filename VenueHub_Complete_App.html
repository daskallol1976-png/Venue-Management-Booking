<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VenueHub — IIBF/SIFY Venue Management</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #f0f4ff;
  --sidebar: #1a1150;
  --sidebar-active: #2d1f8e;
  --sidebar-text: rgba(255,255,255,0.75);
  --sidebar-text-active: #fff;
  --card: #fff;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --purple: #6c47ff;
  --purple-light: #ede9ff;
  --blue: #3b82f6;
  --blue-light: #dbeafe;
  --green: #10b981;
  --green-light: #d1fae5;
  --orange: #f59e0b;
  --orange-light: #fef3c7;
  --red: #ef4444;
  --red-light: #fee2e2;
  --pink: #ec4899;
  --pink-light: #fce7f3;
  --teal: #14b8a6;
  --teal-light: #ccfbf1;
  --indigo: #6366f1;
  --indigo-light: #e0e7ff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.12), 0 8px 32px rgba(0,0,0,.08);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font: 'Plus Jakarta Sans', sans-serif;
  --font-display: 'Sora', sans-serif;
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:var(--font)}
input,select,textarea{font-family:var(--font)}

/* ─── LAYOUT ─── */
#app{display:flex;min-height:100vh}
.sidebar{width:260px;min-height:100vh;background:var(--sidebar);display:flex;flex-direction:column;transition:width var(--transition);position:fixed;top:0;left:0;bottom:0;z-index:100;overflow:hidden}
.sidebar.collapsed{width:72px}
.main{margin-left:260px;flex:1;min-height:100vh;transition:margin-left var(--transition)}
.main.collapsed{margin-left:72px}
.page{padding:32px;max-width:1400px}

/* ─── SIDEBAR ─── */
.sidebar-logo{padding:24px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-logo-icon{width:40px;height:40px;background:var(--purple);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sidebar-logo-text{font-family:var(--font-display);font-size:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;transition:opacity var(--transition)}
.sidebar.collapsed .sidebar-logo-text{opacity:0;width:0}
.sidebar-toggle{background:rgba(255,255,255,.1);border:none;color:#fff;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0;transition:background var(--transition)}
.sidebar-toggle:hover{background:rgba(255,255,255,.2)}
.sidebar-nav{padding:16px 12px;flex:1;overflow-y:auto}
.nav-section{margin-bottom:8px}
.nav-section-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;padding:8px 8px 4px;white-space:nowrap;overflow:hidden;transition:opacity var(--transition)}
.sidebar.collapsed .nav-section-label{opacity:0}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--sidebar-text);font-size:14px;font-weight:500;width:100%;transition:all var(--transition);white-space:nowrap;cursor:pointer;position:relative}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(108,71,255,.4)}
.nav-item svg{flex-shrink:0;width:20px;height:20px}
.nav-item-label{overflow:hidden;transition:opacity var(--transition)}
.sidebar.collapsed .nav-item-label{opacity:0;width:0}
.nav-item .badge{position:absolute;right:12px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;transition:opacity var(--transition)}
.sidebar.collapsed .badge{opacity:0}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.07);border-radius:10px;margin-bottom:8px}
.user-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.user-chip-info{overflow:hidden;transition:opacity var(--transition)}
.sidebar.collapsed .user-chip-info{opacity:0;width:0}
.user-chip-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap}
.user-chip-role{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap}
.logout-btn{display:flex;align-items:center;gap:10px;width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.25);color:#f87171;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;transition:all var(--transition)}
.logout-btn:hover{background:rgba(239,68,68,.25);color:#fff}
.logout-btn span{overflow:hidden;transition:opacity var(--transition)}
.sidebar.collapsed .logout-btn span{opacity:0;width:0}

/* ─── TOPBAR ─── */
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;gap:16px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.topbar-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text);flex:1}
.topbar-breadcrumb{font-size:12px;color:var(--text-muted);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-role-badge{padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em}

/* ─── PAGES ─── */
.page-header{margin-bottom:28px}
.page-title{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--text);margin-bottom:4px}
.page-subtitle{font-size:14px;color:var(--text-muted)}

/* ─── STAT CARDS ─── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-top:4px solid transparent;position:relative;overflow:hidden;transition:transform var(--transition),box-shadow var(--transition)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card-bg{position:absolute;right:-20px;top:-20px;font-size:80px;opacity:.06;line-height:1;pointer-events:none}
.stat-card-label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-card-value{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;margin-bottom:4px}
.stat-card-sub{font-size:12px;color:var(--text-muted)}

/* ─── CARDS ─── */
.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.card-title{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)}
.card + .card{margin-top:20px}

/* ─── TABLES ─── */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead tr{background:linear-gradient(135deg,#f8f6ff,#f0f4ff)}
th{padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
td{padding:13px 16px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background var(--transition)}
tbody tr:hover{background:#fafbff}

/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em}
.badge-confirmed{background:var(--green-light);color:#065f46}
.badge-pending{background:var(--orange-light);color:#92400e}
.badge-audit{background:var(--blue-light);color:#1e40af}
.badge-super-admin{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.badge-admin{background:var(--purple-light);color:#4c1d95}
.badge-user{background:var(--green-light);color:#065f46}
.badge-active{background:var(--green-light);color:#065f46}
.badge-inactive{background:var(--red-light);color:#7f1d1d}
.badge-completed{background:var(--green-light);color:#065f46}
.badge-in-progress{background:var(--blue-light);color:#1e40af}
.badge-not-started{background:var(--border);color:var(--text-muted)}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:none;transition:all var(--transition)}
.btn-primary{background:linear-gradient(135deg,var(--purple),#4f35cc);color:#fff;box-shadow:0 4px 12px rgba(108,71,255,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,71,255,.4)}
.btn-success{background:linear-gradient(135deg,var(--green),#059669);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.3)}
.btn-success:hover{transform:translateY(-1px)}
.btn-danger{background:linear-gradient(135deg,var(--red),#dc2626);color:#fff;box-shadow:0 4px 12px rgba(239,68,68,.25)}
.btn-danger:hover{transform:translateY(-1px)}
.btn-warn{background:linear-gradient(135deg,var(--orange),#d97706);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-muted)}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-light)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-icon{padding:8px;border-radius:8px;background:transparent;border:1.5px solid var(--border);color:var(--text-muted);transition:all var(--transition)}
.btn-icon:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-light)}
.btn-icon.edit:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.btn-icon.del:hover{border-color:var(--red);color:var(--red);background:var(--red-light)}

/* ─── FORMS ─── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
label.form-label{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
input.form-input,select.form-input,textarea.form-input{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text);background:#fff;transition:border-color var(--transition),box-shadow var(--transition);width:100%}
input.form-input:focus,select.form-input:focus,textarea.form-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.12)}
.form-actions{display:flex;gap:12px;margin-top:8px}

/* ─── SEARCH BAR ─── */
.search-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search-input-wrap{position:relative;flex:1;min-width:220px}
.search-input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;width:16px;height:16px}
.search-input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:#fff;transition:border-color var(--transition)}
.search-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,71,255,.1)}
.filter-select{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:#fff;color:var(--text);min-width:150px;cursor:pointer;transition:border-color var(--transition)}
.filter-select:focus{outline:none;border-color:var(--purple)}

/* ─── PROGRESS BAR ─── */
.progress-wrap{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ─── HUB CARDS ─── */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hub-card{padding:16px;border-radius:var(--radius-sm);border-left:4px solid;background:#fff;box-shadow:var(--shadow);transition:transform var(--transition)}
.hub-card:hover{transform:translateY(-2px)}

/* ─── USER CARDS ─── */
.user-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.user-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform var(--transition),box-shadow var(--transition)}
.user-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.user-card-banner{position:absolute;top:0;left:0;right:0;height:80px}
.user-card-avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-top:36px;border:4px solid #fff;position:relative}
.user-card-name{font-size:16px;font-weight:700;margin:10px 0 2px;color:var(--text)}
.user-card-email{font-size:13px;color:var(--text-muted);margin-bottom:12px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.perm-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px}
.perm-yes{background:var(--green-light);color:#065f46}
.perm-no{background:#f3f4f6;color:#9ca3af}

/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:var(--radius-lg);padding:32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.2);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.modal-title{font-family:var(--font-display);font-size:20px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;color:var(--text-muted);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background var(--transition)}
.modal-close:hover{background:var(--bg);color:var(--text)}

/* ─── LOGIN ─── */
.login-page{min-height:100vh;display:flex;align-items:stretch;background:#fff}
.login-left{flex:1;background:linear-gradient(135deg,#1a1150 0%,#2d1f8e 50%,#6c47ff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#fff;position:relative;overflow:hidden}
.login-left::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.login-left-title{font-family:var(--font-display);font-size:42px;font-weight:700;margin-bottom:16px;line-height:1.1;position:relative}
.login-left-sub{font-size:16px;opacity:.7;max-width:320px;text-align:center;line-height:1.6;position:relative}
.login-left-badges{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap;justify-content:center;position:relative}
.login-left-badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;backdrop-filter:blur(4px)}
.login-right{width:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 48px}
.login-form-title{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--text);margin-bottom:4px;text-align:center}
.login-form-sub{font-size:14px;color:var(--text-muted);margin-bottom:36px;text-align:center}
.login-form{width:100%}
.login-demo{background:linear-gradient(135deg,#f0f4ff,#faf0ff);border:1px solid #ddd6fe;border-radius:var(--radius-sm);padding:16px;margin-top:24px}
.login-demo-title{font-size:12px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.login-demo-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;transition:background var(--transition)}
.login-demo-row:hover{background:rgba(108,71,255,.08)}
.login-demo-role{font-size:11px;font-weight:700}
.login-demo-creds{font-size:12px;color:var(--text-muted)}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px}
.pw-wrap{position:relative}

/* ─── ALERTS ─── */
.alert{padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.alert-info{background:var(--blue-light);color:#1e40af;border-left:4px solid var(--blue)}
.alert-warn{background:var(--orange-light);color:#92400e;border-left:4px solid var(--orange)}
.alert-error{background:var(--red-light);color:#7f1d1d;border-left:4px solid var(--red)}
.alert-success{background:var(--green-light);color:#065f46;border-left:4px solid var(--green)}

/* ─── TABS ─── */
.tab-bar{display:flex;gap:4px;margin-bottom:24px;background:var(--card);padding:4px;border-radius:var(--radius-sm);width:fit-content;box-shadow:var(--shadow)}
.tab-btn{padding:8px 20px;border:none;background:transparent;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-muted);transition:all var(--transition);cursor:pointer}
.tab-btn.active{background:var(--purple);color:#fff;box-shadow:0 4px 10px rgba(108,71,255,.35)}
.tab-btn:not(.active):hover{background:var(--purple-light);color:var(--purple)}

/* ─── PLANNING ─── */
.planning-table thead tr{background:linear-gradient(135deg,var(--sidebar),var(--sidebar-active))}
.planning-table th{color:rgba(255,255,255,.8)}
.planning-table .status-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700}

/* ─── CHART ─── */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding:8px 0}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:6px}
.bar-outer{width:100%;height:120px;display:flex;align-items:flex-end;border-radius:6px 6px 0 0;overflow:hidden}
.bar-inner{width:100%;border-radius:6px 6px 0 0;transition:height .6s cubic-bezier(.4,0,.2,1)}
.bar-label{font-size:11px;color:var(--text-muted);font-weight:600;text-align:center}
.bar-value{font-size:12px;font-weight:700;color:var(--text)}

/* ─── AUDIT ─── */
.audit-row-status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.audit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){
  .login-left{display:none}
  .login-right{width:100%;padding:40px 24px}
  .main{margin-left:72px}
  .sidebar{width:72px}
  .sidebar-logo-text,.nav-item-label,.user-chip-info,.logout-btn span,.nav-section-label{opacity:0;width:0}
  .page{padding:20px}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .user-grid{grid-template-columns:1fr}
  .hub-grid{grid-template-columns:1fr}
}

/* ─── ANIMATIONS ─── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .3s ease forwards}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
const HUBS = ['Mumbai','Delhi','Bangalore','Chennai','Kolkata','Pune','Hyderabad'];

let state = {
  currentUser: null,
  page: 'dashboard',
  sidebarCollapsed: false,
  modal: null,
  toast: null,
  venueTab: 'master',
  searchTerm: '',
  selectedHub: 'all',
  selectedStatus: 'all',

  users: [

// HELPERS

function can(action){
  const r = state.currentUser?.role;
  switch(action){
    case 'create': return r === 'admin' || r === 'super-admin';
    case 'edit':   return true;
    case 'delete': return r === 'admin' || r === 'super-admin';
    case 'manageUsers': return r === 'admin' || r === 'super-admin';
    case 'createUsers': return r === 'super-admin';
    case 'deleteUsers': return r === 'super-admin';
    case 'viewAllUsers': return r === 'super-admin' || r === 'admin';
    case 'analytics': return r === 'admin' || r === 'super-admin';
    default: return false;
  }
}

function roleColor(role){
  if(role==='super-admin') return {bg:'linear-gradient(135deg,#667eea,#764ba2)',text:'#fff'};
  if(role==='admin') return {bg:'var(--purple-light)',text:'#4c1d95'};
  return {bg:'var(--green-light)',text:'#065f46'};
}

function hubColor(idx){
  const colors=['#6c47ff','#10b981','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#ec4899'];
  return colors[idx % colors.length];
}

function showToast(msg, type='success'){
  state.toast = {msg, type};
  render();
  setTimeout(()=>{state.toast=null; render();}, 3000);
}

function openModal(type, data={}){
  state.modal = {type, data};
  render();
}

function closeModal(){
  state.modal = null;
  render();
}

function navigate(page){
  state.page = page;
  state.searchTerm = '';
  state.selectedHub = 'all';
  state.selectedStatus = 'all';
  render();
}

// ════════════════════════════════════════════════════════
function renderDashboard(){
  const v = state.venues;
  const confirmed = v.filter(x=>x.status==='confirmed').length;
  const pending = v.filter(x=>x.status==='pending').length;
  const audited = v.filter(x=>x.auditStatus==='completed').length;
  const inProgress = v.filter(x=>x.auditStatus==='in-progress').length;
  const pct = Math.round(confirmed/v.length*100);

  const statCards = [
    {label:'Total Venues',value:v.length,color:'var(--purple)',bg:'var(--purple-light)',icon:'📍',sub:`${pct}% confirmed`},
    {label:'Confirmed',value:confirmed,color:'var(--green)',bg:'var(--green-light)',icon:'✅',sub:'Approved venues'},
    {label:'Pending',value:pending,color:'var(--orange)',bg:'var(--orange-light)',icon:'⏳',sub:'Awaiting approval'},
    {label:'Audits Complete',value:audited,color:'var(--blue)',bg:'var(--blue-light)',icon:'📋',sub:`${inProgress} in progress`},
    {label:'Partners',value:state.partners.length,color:'var(--pink)',bg:'var(--pink-light)',icon:'🤝',sub:'Active partnerships'},
    {label:'Total Users',value:state.users.length,color:'var(--indigo)',bg:'var(--indigo-light)',icon:'👥',sub:'System users'},
  ];

  const hubStats = HUBS.map((hub,i)=>{
    const hv = v.filter(x=>x.hub===hub);
    const hc = hv.filter(x=>x.status==='confirmed').length;
    const pct = hv.length ? Math.round(hc/hv.length*100) : 0;
    return {hub,total:hv.length,confirmed:hc,pct,color:hubColor(i)};
  }).filter(h=>h.total>0);

  const recentVenues = [...v].sort((a,b)=>b.id-a.id).slice(0,5);

  const content = `
    <div class="page-header">
      <div class="page-title">Dashboard Overview</div>
      <div class="page-subtitle">Welcome back, ${state.currentUser.name} — here's what's happening today</div>
    </div>

    <div class="stats-grid">
      ${statCards.map(s=>`
        <div class="stat-card" style="border-top-color:${s.color}">
          <div class="stat-card-bg">${s.icon}</div>
          <div class="stat-card-label">${s.label}</div>
          <div class="stat-card-value" style="color:${s.color}">${s.value}</div>
          <div class="stat-card-sub">${s.sub}</div>
        </div>
      `).join('')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Hub-wise Confirmation Status</div>
        </div>
        ${hubStats.map(h=>`
          <div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-size:13px;font-weight:600">${h.hub}</span>
              <span style="font-size:12px;color:var(--text-muted)">${h.confirmed}/${h.total} &nbsp; <b style="color:${h.color}">${h.pct}%</b></span>
            </div>
            <div class="progress-wrap">
              <div class="progress-bar" style="width:${h.pct}%;background:${h.color}"></div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Audit Status Breakdown</div>
        </div>
        <div class="bar-chart">
          ${[
            {label:'Not Started',count:v.filter(x=>x.auditStatus==='not-started').length,color:'#e5e7eb'},
            {label:'In Progress',count:inProgress,color:'var(--blue)'},
            {label:'Completed',count:audited,color:'var(--green)'},
          ].map(b=>{
            const max = Math.max(v.filter(x=>x.auditStatus==='not-started').length, inProgress, audited, 1);
            const h = Math.round((b.count/max)*100);
            return `<div class="bar-col">
              <div class="bar-value">${b.count}</div>

// PLANNING SHEET
// ════════════════════════════════════════════════════════
function renderPlanning(){
  const hubData = HUBS.map((hub,i)=>{
    const hv = state.venues.filter(v=>v.hub===hub);
    const conf = hv.filter(v=>v.status==='confirmed').length;
    const pend = hv.filter(v=>v.status==='pending').length;
    const audited = hv.filter(v=>v.auditStatus==='completed').length;
    const inProg = hv.filter(v=>v.auditStatus==='in-progress').length;
    const pct = hv.length?Math.round(conf/hv.length*100):0;
    const color = hubColor(i);
    const statusLabel = pct===100?'Complete':pct>=60?'On Track':pct>=30?'At Risk':'Delayed';
    const statusColor = pct===100?'var(--green)':pct>=60?'var(--blue)':pct>=30?'var(--orange)':'var(--red)';
    return {hub,total:hv.length,confirmed:conf,pending:pend,audited,inProg,pct,color,statusLabel,statusColor};
  }).filter(h=>h.total>0);

  const content = `
    <div class="page-header">
      <div class="page-title">Planning Sheet</div>
      <div class="page-subtitle">Hub-wise venue planning status and completion tracking</div>
    </div>

    <div class="hub-grid" style="margin-bottom:28px">
      ${hubData.map(h=>`
        <div class="hub-card" style="border-left-color:${h.color}">
          <div style="font-weight:700;color:var(--text);margin-bottom:8px">${h.hub}</div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:6px">
            <span>${h.confirmed}/${h.total} confirmed</span>
            <b style="color:${h.color}">${h.pct}%</b>
          </div>
          <div class="progress-wrap"><div class="progress-bar" style="width:${h.pct}%;background:${h.color}"></div></div>
          <span style="display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:${h.statusColor};background:${h.statusColor}20;padding:2px 8px;border-radius:99px">${h.statusLabel}</span>
        </div>
      `).join('')}
    </div>

    <div class="card" style="padding:0">
      <div style="padding:20px 24px;border-bottom:1px solid var(--border)">
        <div class="card-title">Detailed Planning Table</div>
      </div>
      <div class="table-wrap">
        <table class="planning-table">
          <thead><tr>
            <th>Hub</th><th>Total Venues</th><th>Confirmed</th><th>Pending</th><th>Audited</th><th>In Progress</th><th>Completion %</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${hubData.map(h=>`
              <tr>
                <td><span style="font-weight:700">${h.hub}</span></td>
                <td style="text-align:center;font-weight:700">${h.total}</td>
                <td style="text-align:center"><span style="color:var(--green);font-weight:700">${h.confirmed}</span></td>
                <td style="text-align:center"><span style="color:var(--orange);font-weight:700">${h.pending}</span></td>
                <td style="text-align:center"><span style="color:var(--blue);font-weight:700">${h.audited}</span></td>
                <td style="text-align:center"><span style="color:var(--indigo);font-weight:700">${h.inProg}</span></td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <div style="flex:1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden">
                      <div style="height:100%;width:${h.pct}%;background:${h.color};border-radius:99px"></div>
                    </div>
                    <span style="font-size:12px;font-weight:700;min-width:36px;color:${h.color}">${h.pct}%</span>
                  </div>
                </td>
                <td><span class="planning-table status-chip" style="background:${h.statusColor}20;color:${h.statusColor}">${h.statusLabel}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>

  return renderLayout(content, 'Planning Sheet', 'VenueHub / Planning');

// ════════════════════════════════════════════════════════
// HUB ANALYTICS
// ════════════════════════════════════════════════════════
function renderAnalytics(){
  const hubData = HUBS.map((hub,i)=>{
    const hv = state.venues.filter(v=>v.hub===hub);
    const hp = state.partners.filter(p=>p.hub===hub);
    const conf = hv.filter(v=>v.status==='confirmed').length;
    const audited = hv.filter(v=>v.auditStatus==='completed').length;
    const findings = hv.reduce((s,v)=>s+v.findings,0);
    const pct = hv.length?Math.round(conf/hv.length*100):0;
    return {hub,venues:hv.length,partners:hp.length,confirmed:conf,audited,findings,pct,color:hubColor(i)};
  }).filter(h=>h.venues>0);

  const content = `
    <div class="page-header">
      <div class="page-title">Hub Analytics</div>
      <div class="page-subtitle">Detailed performance metrics across all hubs</div>
    </div>

    <div class="stats-grid" style="margin-bottom:28px">
      ${[
        {label:'Total Hubs Active',value:hubData.length,color:'var(--purple)'},
        {label:'Highest Confirmed',value:Math.max(...hubData.map(h=>h.pct))+'%',color:'var(--green)'},
        {label:'Total Findings',value:hubData.reduce((s,h)=>s+h.findings,0),color:'var(--red)'},
        {label:'Avg Venues/Hub',value:Math.round(state.venues.length/hubData.length),color:'var(--blue)'},
      ].map(s=>`
        <div class="stat-card" style="border-top-color:${s.color}">
          <div class="stat-card-label">${s.label}</div>
          <div class="stat-card-value" style="color:${s.color}">${s.value}</div>
        </div>
      `).join('')}
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px">
      ${hubData.map(h=>`
        <div class="card" style="border-top:4px solid ${h.color}">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
            <div style="width:44px;height:44px;border-radius:12px;background:${h.color}20;display:flex;align-items:center;justify-content:center;font-size:20px">📍</div>
            <div>
              <div style="font-family:var(--font-display);font-size:18px;font-weight:700">${h.hub}</div>
              <div style="font-size:12px;color:var(--text-muted)">${h.venues} venue${h.venues!==1?'s':''} · ${h.partners} partner${h.partners!==1?'s':''}</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
            ${[
              {l:'Confirmed',v:h.confirmed,c:'var(--green)'},
              {l:'Audited',v:h.audited,c:'var(--blue)'},
              {l:'Partners',v:h.partners,c:'var(--pink)'},
              {l:'Findings',v:h.findings,c:'var(--red)'},
            ].map(m=>`
              <div style="background:var(--bg);border-radius:8px;padding:10px">
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">${m.l}</div>
                <div style="font-size:22px;font-weight:800;color:${m.c}">${m.v}</div>
              </div>
            `).join('')}
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
              <span style="color:var(--text-muted)">Confirmation Rate</span>
              <b style="color:${h.color}">${h.pct}%</b>
            </div>
            <div class="progress-wrap" style="height:10px"><div class="progress-bar" style="width:${h.pct}%;background:${h.color}"></div></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  return renderLayout(content, 'Hub Analytics', 'VenueHub / Analytics');
}

// ════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════
function renderToast(){
  if(!state.toast) return '';
  const colors = {success:'var(--green)',error:'var(--red)',info:'var(--blue)',warn:'var(--orange)'};
  return `
    <div style="position:fixed;bottom:24px;right:24px;z-index:2000;min-width:280px;max-width:400px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);border-left:4px solid ${colors[state.toast.type]||'var(--green)'};padding:16px 20px;display:flex;align-items:center;gap:12px;animation:fadeIn .3s ease">
      <span style="font-size:18px">${state.toast.type==='success'?'✅':state.toast.type==='error'?'❌':state.toast.type==='warn'?'⚠️':'ℹ️'}</span>
      <span style="font-size:14px;font-weight:600;color:var(--text)">${state.toast.msg}</span>
    </div>`;
}

// ════════════════════════════════════════════════════════
// MAIN RENDER
// ════════════════════════════════════════════════════════
function render(){
  const app = document.getElementById('app');
  if(!state.currentUser){
    app.innerHTML = renderLogin() + renderToast();
    bindLoginEvents();
    return;
  }
  let pageHtml = '';
  switch(state.page){
    case 'dashboard': pageHtml = renderDashboard(); break;
    case 'venues':    pageHtml = renderVenues(); break;
    case 'audit':     pageHtml = renderAudit(); break;
    case 'partners':  pageHtml = renderPartners(); break;
    case 'planning':  pageHtml = renderPlanning(); break;
    case 'analytics': pageHtml = renderAnalytics(); break;
    case 'users':     pageHtml = renderUsers(); break;
    case 'settings':  pageHtml = renderSettings(); break;
    default: pageHtml = renderDashboard();
  }
  app.innerHTML = pageHtml + renderModal() + renderToast();
}

// ════════════════════════════════════════════════════════
// EVENT HANDLERS
// ════════════════════════════════════════════════════════
function bindLoginEvents(){
  const form = document.getElementById('loginForm');
  if(form) form.addEventListener('submit', e=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const pass  = document.getElementById('loginPassword').value;
    const user  = state.users.find(u=>u.email===email&&u.password===pass);
    if(user){
      state.currentUser = user;
      state.page = 'dashboard';
      render();
      showToast(`Welcome back, ${user.name}!`);
    } else {
      document.getElementById('loginError').style.display='flex';
    }
  });
  const pt = document.getElementById('pwToggle');
  if(pt) pt.addEventListener('click', ()=>{
    const inp = document.getElementById('loginPassword');
    inp.type = inp.type==='password'?'text':'password';
    pt.innerHTML = inp.type==='text'?Icons.eyeOff:Icons.eye;
  });
}

function doLogout(){
  state.currentUser = null;
  state.page = 'dashboard';
  state.modal = null;
  render();
  showToast('Signed out successfully.', 'info');
}

function toggleSidebar(){
  state.sidebarCollapsed = !state.sidebarCollapsed;
  render();
}

function updateSearch(val){
  state.searchTerm = val;
  render();
}
function updateHub(val){
  state.selectedHub = val;
  render();
}
function updateStatus(val){
  state.selectedStatus = val;
  render();
}

function handleOverlayClick(e){
  if(e.target.classList.contains('modal-overlay')) closeModal();
}

// VENUE ACTIONS
function deleteVenue(id){
  if(!can('delete')) return;
  if(!confirm('Delete this venue and its audit record?')) return;
  state.venues = state.venues.filter(v=>v.id!==id);
  render();
  showToast('Venue deleted and audit removed.', 'warn');
}

function submitAddVenue(e){
  e.preventDefault();
  const venue = {
    id: state.nextId++,
    name: document.getElementById('vName').value,
    hub: document.getElementById('vHub').value,
    status: document.getElementById('vStatus').value,
    contact: document.getElementById('vContact').value,
    phone: document.getElementById('vPhone').value,
    partners: parseInt(document.getElementById('vPartners').value)||0,
    capacity: parseInt(document.getElementById('vCapacity').value)||100,
    date: new Date().toISOString().split('T')[0],
    auditStatus: 'not-started',
    findings: 0,
    auditor: '',
  };
  state.venues.push(venue);
  closeModal();
  render();
  showToast('Venue created! Pending audit entry auto-generated.');
}

  state.users = state.users.filter(u=>u.id!==id);

  const p = {
    id: state.nextPartnerId++,
    name: partner, hub,
    venueCount: 1,
    contact, email,
    status: 'active',
    joined: new Date().toISOString().split('T')[0],
  };
  state.partners.push(p);

  closeModal();
  render();
  showToast('Partner venue added → Venue Master updated → Audit case created!');
}

// Initial render
render();
</script>
</body>
</html>
